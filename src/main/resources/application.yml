spring:
  sql:
    init:
      mode: never
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/auditlog}
    username: ${SPRING_DATASOURCE_USERNAME:auditlog}
    password: ${SPRING_DATASOURCE_PASSWORD:auditlog}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://localhost:8081/realms/audit-log}

audit:
  hash:
    # Required at startup. Set AUDIT_HASH_SECRET to a strong, non-default secret.
    secret: ${AUDIT_HASH_SECRET:change-me-in-production}
  api:
    max-request-bytes: 1048576
    rate-limit:
      max-requests: 60
      window: 60s
  retention:
    period: 365d
    archive-cron: "0 0 2 * * *"
  redaction:
    replacement: "[REDACTED]"
    sensitive-keys:
      - password
      - passcode
      - secret
      - token
      - authorization
      - ssn
      - socialSecurityNumber
      - creditCard
      - creditCardNumber
      - cardNumber
      - cvv
      - pan
      - accountNumber
      - email
      - phone
      - dob
