spring:
  datasource:
    url: jdbc:h2:mem:auditlog;MODE=PostgreSQL;DATABASE_TO_UPPER=false
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

audit:
  retention:
    period: 365d
    archive-cron: "0 0 2 * * *"
