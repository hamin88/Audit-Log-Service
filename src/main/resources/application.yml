spring:
  datasource:
    url: jdbc:h2:mem:auditlog;MODE=PostgreSQL;DATABASE_TO_UPPER=false
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

audit:
  hash:
    # Required at startup. Set AUDIT_HASH_SECRET to a strong, non-default secret.
    secret: ${AUDIT_HASH_SECRET:change-me-in-production}
  retention:
    period: 365d
    archive-cron: "0 0 2 * * *"
  redaction:
    replacement: "[REDACTED]"
    sensitive-keys:
      - password
      - passcode
      - secret
      - token
      - authorization
      - ssn
      - socialSecurityNumber
      - creditCard
      - creditCardNumber
      - cardNumber
      - cvv
      - pan
      - accountNumber
      - email
      - phone
      - dob
