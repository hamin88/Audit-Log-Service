spring:
  sql:
    init:
      mode: never
  datasource:
    url: jdbc:h2:mem:auditlog-test;MODE=PostgreSQL;DATABASE_TO_UPPER=false
    driver-class-name: org.h2.Driver
    username: sa
    password:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9999/realms/audit-log/protocol/openid-connect/certs
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

audit:
  hash:
    secret: audit-log-test-secret
  retention:
    archive-cron: "0 0 2 * * *"
